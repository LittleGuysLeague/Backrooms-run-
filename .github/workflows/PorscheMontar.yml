
name: Montar Porsche 911 GT3 RS

on:
  workflow_dispatch:

jobs:
  montar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Instalar Blender e NumPy
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy

      - name: Conferir arquivos necessarios
        run: |
          test -s "01_070715SSCR_HD.glb"

      - name: Criar script de montagem
        run: |
          cat > montar.py <<'PY'
          import bpy
          import os

          root = os.getcwd()
          glb = os.path.join(root, "01_070715SSCR_HD.glb")
          output = os.path.join(root, "resultado")

          os.makedirs(output, exist_ok=True)

          if not os.path.isfile(glb):
              raise RuntimeError("GLB corrigido nao encontrado.")

          bpy.ops.wm.read_factory_settings(use_empty=True)

          # Importa o GLB corrigido.
          bpy.ops.import_scene.gltf(filepath=glb)

          glb_objects = [
              obj for obj in bpy.context.scene.objects
              if obj.type == "MESH"
          ]

          if not glb_objects:
              raise RuntimeError("Nenhuma malha foi encontrada no GLB.")

          # Procura as texturas disponiveis no repositorio.
          texture_files = {}

          for filename in os.listdir(root):
              if filename.lower().endswith((".png", ".jpg", ".jpeg")):
                  texture_files[filename.lower()] = os.path.join(root, filename)

          # Corrige caminhos de imagens ja utilizadas pelos materiais.
          packed_images = 0

          for image in bpy.data.images:
              if image.source != "FILE":
                  continue

              basename = os.path.basename(image.filepath).lower()

              if basename in texture_files:
                  image.filepath = texture_files[basename]
                  try:
                      image.reload()
                  except Exception:
                      pass

              try:
                  image.pack()
                  packed_images += 1
              except Exception:
                  pass

          # Exporta somente a geometria do GLB corrigido.
          destino = os.path.join(output, "porsche-candidato.glb")

          bpy.ops.export_scene.gltf(
              filepath=destino,
              export_format="GLB",
              export_materials="EXPORT"
          )

          if not os.path.isfile(destino) or os.path.getsize(destino) == 0:
              raise RuntimeError("O GLB final nao foi criado corretamente.")

          report = [
              "Montagem do Porsche 911 GT3 RS",
              f"Malhas mantidas: {len(glb_objects)}",
              f"Texturas encontradas no repositorio: {len(texture_files)}",
              f"Imagens empacotadas: {packed_images}",
              "",
              "Geometria original do GLB preservada.",
              "Nenhum FBX foi importado.",
              "Nenhuma associacao nova de textura foi criada automaticamente."
          ]

          with open(os.path.join(output, "relatorio-porsche.txt"), "w") as f:
              f.write("\n".join(report))

          print("\n".join(report))
          print("EXPORTACAO CONCLUIDA COM SUCESSO!")
          PY

      - name: Montar e exportar Porsche
        run: |
          blender -b --python-exit-code 1 -P montar.py

      - name: Conferir resultado
        run: |
          test -s resultado/porsche-candidato.glb
          test -s resultado/relatorio-porsche.txt
          echo "Arquivos gerados corretamente!"

      - name: Disponibilizar resultado
        uses: actions/upload-artifact@v4
        with:
          name: Porsche-911-GT3-RS
          path: resultado/
          if-no-files-found: error
