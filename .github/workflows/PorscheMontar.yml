
name: Montar Porsche 911 GT3 RS

on:
  workflow_dispatch:

jobs:
  montar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Instalar Blender e NumPy
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy

      - name: Conferir arquivos necessarios
        run: |
          test -f "01_070715SSCR_HD.glb"
          test -f "car.unitypackage"

      - name: Extrair FBX original do Unity
        run: |
          python3 - <<'PY'
          import tarfile, os, shutil

          package = "car.unitypackage"
          os.makedirs("temp", exist_ok=True)
          encontrado = False

          with tarfile.open(package, "r:gz") as tar:
              for member in tar.getmembers():
                  if member.name.endswith("/pathname"):
                      f = tar.extractfile(member)
                      if not f:
                          continue

                      caminho = f.read().decode("utf-8", "ignore").strip()

                      if caminho == "Assets/01_070715SSCR_HD.fbx":
                          folder = member.name.rsplit("/", 1)[0]
                          asset = tar.extractfile(folder + "/asset")

                          if asset:
                              with open("temp/reference.fbx", "wb") as out:
                                  shutil.copyfileobj(asset, out)

                              encontrado = True
                              print("FBX original encontrado!")
                              break

          if not encontrado:
              raise SystemExit("FBX original nao encontrado no pacote.")
          PY

      - name: Criar script de montagem
        run: |
          cat > montar.py <<'PY'
          import bpy
          import os

          root = os.getcwd()
          glb = os.path.join(root, "01_070715SSCR_HD.glb")
          fbx = os.path.join(root, "temp/reference.fbx")
          output = os.path.join(root, "resultado")

          os.makedirs(output, exist_ok=True)

          if not os.path.isfile(glb):
              raise RuntimeError("GLB corrigido nao encontrado.")

          if not os.path.isfile(fbx):
              raise RuntimeError("FBX de referencia nao encontrado.")

          bpy.ops.wm.read_factory_settings(use_empty=True)

          # Importa o GLB corrigido: ele sera a geometria final.
          bpy.ops.import_scene.gltf(filepath=glb)

          glb_objects = [
              obj for obj in bpy.context.scene.objects
              if obj.type == "MESH"
          ]

          if not glb_objects:
              raise RuntimeError("Nenhuma malha foi encontrada no GLB.")

          # Guarda os objetos originais do GLB.
          glb_object_ids = {obj.as_pointer() for obj in glb_objects}

          # Importa o FBX apenas como referencia.
          bpy.ops.import_scene.fbx(filepath=fbx)

          fbx_objects = [
              obj for obj in bpy.context.scene.objects
              if obj.type == "MESH"
              and obj.as_pointer() not in glb_object_ids
          ]

          # Procura as texturas disponiveis no repositorio.
          texture_files = {}

          for filename in os.listdir(root):
              if filename.lower().endswith((".png", ".jpg", ".jpeg")):
                  texture_files[filename.lower()] = os.path.join(root, filename)

          # Corrige caminhos de imagens e empacota as encontradas.
          for image in bpy.data.images:
              basename = os.path.basename(image.filepath).lower()

              if basename in texture_files:
                  image.filepath = texture_files[basename]
                  try:
                      image.reload()
                  except Exception:
                      pass

              if image.source == "FILE":
                  try:
                      image.pack()
                  except Exception:
                      pass

          # Conta os materiais de referencia encontrados no FBX.
          reference_materials = set()

          for obj in fbx_objects:
              for slot in obj.material_slots:
                  if slot.material:
                      reference_materials.add(slot.material.name)

          # Remove as malhas FBX: somente a geometria GLB sera exportada.
          for obj in fbx_objects:
              bpy.data.objects.remove(obj, do_unlink=True)

          report = [
              "Montagem do Porsche 911 GT3 RS",
              f"Objetos GLB mantidos: {len(glb_objects)}",
              f"Objetos FBX de referencia: {len(fbx_objects)}",
              f"Materiais encontrados no FBX: {len(reference_materials)}",
              f"Arquivos de textura encontrados: {len(texture_files)}",
              "",
              "O GLB corrigido foi mantido como geometria final.",
              "O FBX foi usado como referencia.",
              "Os materiais nao foram associados automaticamente.",
              "A correspondencia das texturas ainda precisa ser feita."
          ]

          destino = os.path.join(output, "porsche-candidato.glb")

          bpy.ops.export_scene.gltf(
              filepath=destino,
              export_format="GLB",
              export_materials="EXPORT"
          )

          if not os.path.isfile(destino) or os.path.getsize(destino) == 0:
              raise RuntimeError("O GLB final nao foi criado corretamente.")

          with open(os.path.join(output, "relatorio-porsche.txt"), "w") as f:
              f.write("\n".join(report))

          print("\n".join(report))
          print("EXPORTACAO CONCLUIDA COM SUCESSO!")
          PY

      - name: Montar e exportar Porsche
        run: |
          blender -b --python-exit-code 1 -P montar.py

      - name: Conferir resultado
        run: |
          test -s resultado/porsche-candidato.glb
          test -s resultado/relatorio-porsche.txt
          echo "Arquivos gerados corretamente!"

      - name: Disponibilizar resultado
        uses: actions/upload-artifact@v4
        with:
          name: Porsche-911-GT3-RS
          path: resultado/
          if-no-files-found: error
