
name: Extrair Porsche ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Localizar e extrair ZIP
        run: |
          ZIP_PATH=$(find . -type f -name "porsche-911-gt3-rs.zip" -not -path "./.git/*" -not -path "./porsche-original/*" -print -quit)

          if [ -z "$ZIP_PATH" ]; then
            echo "ERRO: ZIP não encontrado no repositório."
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_PATH"
          unzip -t "$ZIP_PATH"

          mkdir -p porsche-original
          unzip -o "$ZIP_PATH" -d porsche-original/

      - name: Salvar arquivos no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add porsche-original/
          git commit -m "Extrair arquivos originais do Porsche" || echo "Nenhuma alteração"
          git push
