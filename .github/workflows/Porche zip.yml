
name: Extrair Porsche ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair ZIP na pasta original
        run: |
          ZIP_PATH="porsche-original/porsche-911-gt3-rs.zip"

          if [ ! -f "$ZIP_PATH" ]; then
            echo "ERRO: ZIP não encontrado!"
            exit 1
          fi

          unzip -t "$ZIP_PATH"
          unzip -o "$ZIP_PATH" -d porsche-original/

      - name: Salvar arquivos no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add porsche-original/
          git commit -m "Extrair arquivos originais do Porsche" || echo "Nenhuma alteração"
          git push
