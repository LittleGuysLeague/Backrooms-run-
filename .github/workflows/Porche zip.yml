
name: Extrair Porsche ZIPs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair ZIP principal
        run: |
          unzip -t "porsche-original/porsche-911-gt3-rs.zip"
          unzip -o "porsche-original/porsche-911-gt3-rs.zip" -d porsche-original/

      - name: Extrair ZIP do Porsche GT3 RS Fast
        run: |
          unzip -t "porsche-original/source/Porsche GT3 RS Fast.zip"
          mkdir -p "porsche-original/source/Porsche GT3 RS Fast"
          unzip -o "porsche-original/source/Porsche GT3 RS Fast.zip" -d "porsche-original/source/Porsche GT3 RS Fast/"

      - name: Salvar arquivos no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add porsche-original/
          git commit -m "Extrair os ZIPs originais do Porsche" || echo "Nenhuma alteração"
          git push
