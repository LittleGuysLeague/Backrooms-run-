<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>BACKROOMS: LEVEL 0 - ESCAPE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090807;font-family:'Courier New',monospace;touch-action:none;user-select:none;-webkit-user-select:none}canvas#game{display:block;width:100%;height:100%}
#vhs-overlay{position:fixed;inset:0;pointer-events:none;z-index:5;background:linear-gradient(rgba(18,16,16,0) 50%,rgba(0,0,0,.22) 50%),linear-gradient(90deg,rgba(255,0,0,.035),rgba(0,255,0,.015),rgba(0,0,255,.035));background-size:100% 3px,4px 100%;box-shadow:inset 0 0 90px rgba(0,0,0,.65)}
.scanlines{position:fixed;inset:0;pointer-events:none;z-index:6;background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.13) 3px 4px)}
.hud{position:fixed;color:#fff;text-shadow:2px 2px #000;font-weight:bold;z-index:10;pointer-events:none}.top-left{top:16px;left:16px;font-size:22px}.top-right{top:18px;right:16px;color:#f44;animation:blink 1s infinite}.bottom-left{bottom:15px;left:16px;font-size:14px}.gps{position:fixed;top:11%;left:50%;transform:translateX(-50%);z-index:10;color:#70ff70;text-shadow:1px 1px #000;text-align:center;font-size:13px;pointer-events:none}.arrow{margin:0 auto 5px;width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:24px solid #0f0;filter:drop-shadow(0 0 4px #0f0)}
@keyframes blink{50%{opacity:.35}}
#joystick-zone{position:fixed;z-index:12;left:18px;bottom:22px;width:124px;height:124px;border:2px solid #ffffff55;border-radius:50%;background:#ffffff18;touch-action:none}#joystick-knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:#ffffff88;pointer-events:none}
.btn{position:fixed;z-index:13;border:2px solid #ffffff88;background:#ffffff2b;color:white;border-radius:50%;width:62px;height:62px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px;touch-action:none;box-shadow:0 2px 8px #0008}.btn:active{background:#ffffff66}.hidden{display:none!important}#btn-gas{right:18px;bottom:24px;width:72px;height:72px;background:#00aa4438}#btn-brake{right:28px;bottom:110px}#btn-nitro{right:100px;bottom:28px;background:#0066cc55}#btn-enter{left:50%;bottom:165px;transform:translateX(-50%);width:88px;height:46px;border-radius:10px}#btn-fullscreen{top:14px;left:50%;transform:translateX(-50%);width:42px;height:38px;border-radius:7px}
#look-hint{position:fixed;right:15px;bottom:15px;color:#fff8;font-size:10px;z-index:9;pointer-events:none}
#game-over,#error-screen{position:fixed;inset:0;background:#000e;z-index:30;color:white;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}#game-over h1{font-size:34px}#game-over p,#error-screen p{max-width:420px;line-height:1.5}.restart{padding:13px 24px;background:#333;color:white;border:2px solid white;font: bold 16px 'Courier New';margin-top:12px;border-radius:5px}
#error-screen{z-index:50;background:#090807;display:flex}#error-screen.ready{display:none}#error-screen h2{color:#ffcc66}#error-detail{color:#ddd;font-size:13px;overflow-wrap:anywhere}
@media(hover:hover) and (pointer:fine){#joystick-zone,.btn{opacity:.65}#look-hint{display:none}}
</style>
</head>
<body>
<canvas id="game"></canvas><div id="vhs-overlay"></div><div class="scanlines"></div>
<div class="hud top-left">PLAY ▶</div><div class="hud top-right">● REC</div><div class="hud bottom-left">JUN 12 2002</div>
<div class="gps"><div class="arrow" id="gps-arrow"></div><div id="gps-dist">CARREGANDO...</div></div>
<div id="joystick-zone"><div id="joystick-knob"></div></div>
<div class="btn hidden" id="btn-gas">GAS</div><div class="btn hidden" id="btn-brake">BRK</div><div class="btn hidden" id="btn-nitro">NITRO</div><div class="btn hidden" id="btn-enter">ENTRAR</div><div class="btn" id="btn-fullscreen">⛶</div>
<div id="look-hint">ARRASTE O LADO DIREITO PARA OLHAR</div>
<div id="game-over"><h1 id="end-title">SIGNAL LOST</h1><p id="end-reason">A entidade te encontrou.</p><button class="restart" onclick="location.reload()">JOGAR NOVAMENTE</button></div>
<div id="error-screen"><h2>Não foi possível iniciar o jogo</h2><p>O cenário 3D não conseguiu carregar. Verifique sua conexão com a internet e abra o arquivo novamente no Chrome.</p><p id="error-detail"></p></div>

<!-- Script clássico: funciona melhor ao abrir HTML local pelo Google Files (content://). -->
<script>
(function loadThree(){
 const urls=['https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js','https://unpkg.com/three@0.149.0/build/three.min.js'];
 let i=0;
 function next(){if(i>=urls.length){showLoadError('Não foi possível baixar a biblioteca Three.js dos dois servidores.');return;}const s=document.createElement('script');s.src=urls[i++];s.onload=()=>{try{startGame();}catch(e){showLoadError(e.message||String(e));}};s.onerror=next;document.head.appendChild(s);}
 next();
})();
function showLoadError(msg){document.getElementById('error-detail').textContent=msg;document.getElementById('error-screen').classList.remove('ready');}
function startGame(){
 const THREE=window.THREE;
 if(!THREE){showLoadError('A biblioteca Three.js não ficou disponível.');return;}
 const SIZE=31,CELL=10,WALL_H=8,PLAYER_SPEED=13,CAR_ACCEL=28,CAR_TURN=2.25,MONSTER_SPEED=8.5;
 let scene,camera,renderer,clock,maze=[],car={mesh:null,speed:0,pos:new THREE.Vector3()},monster={mesh:null,active:false},portal={mesh:null,pos:new THREE.Vector3()},mode='FOOT',yaw=0,pitch=0,audio=null,ended=false;
 const keys={w:false,a:false,s:false,d:false,shift:false};
 const input={x:0,y:0,gas:false,brake:false,nitro:false};
 const isMobile=('ontouchstart' in window)||navigator.maxTouchPoints>0;
 const el=id=>document.getElementById(id);
 function texture(kind){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');if(kind==='wall'){x.fillStyle='#c9a45d';x.fillRect(0,0,256,256);for(let i=0;i<70;i++){x.fillStyle=`rgba(100,75,25,${Math.random()*.10})`;x.beginPath();x.arc(Math.random()*256,Math.random()*256,Math.random()*28+5,0,Math.PI*2);x.fill();}x.fillStyle='#8d713f22';for(let i=0;i<256;i+=16)x.fillRect(i,0,1,256);}else if(kind==='floor'){x.fillStyle='#887b68';x.fillRect(0,0,256,256);for(let i=0;i<1500;i++){x.fillStyle=`rgba(0,0,0,${Math.random()*.16})`;x.fillRect(Math.random()*256,Math.random()*256,2,2);}}else{x.fillStyle='#deded8';x.fillRect(0,0,256,256);x.strokeStyle='#aaa';x.strokeRect(0,0,256,256);x.beginPath();x.moveTo(128,0);x.lineTo(128,256);x.moveTo(0,128);x.lineTo(256,128);x.stroke();}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
 const wallMat=new THREE.MeshStandardMaterial({map:texture('wall'),roughness:.9}),floorMat=new THREE.MeshStandardMaterial({map:texture('floor'),roughness:1}),ceilMat=new THREE.MeshStandardMaterial({map:texture('ceil'),roughness:.8});
 function makeMaze(){for(let x=0;x<SIZE;x++){maze[x]=[];for(let z=0;z<SIZE;z++)maze[x][z]=1;}const stack=[{x:1,z:1}];maze[1][1]=0;const dirs=[{x:0,z:-2},{x:0,z:2},{x:-2,z:0},{x:2,z:0}];while(stack.length){const cur=stack[stack.length-1],order=dirs.slice().sort(()=>Math.random()-.5);let moved=false;for(const d of order){const nx=cur.x+d.x,nz=cur.z+d.z;if(nx>0&&nx<SIZE-1&&nz>0&&nz<SIZE-1&&maze[nx][nz]===1){maze[nx][nz]=0;maze[cur.x+d.x/2][cur.z+d.z/2]=0;stack.push({x:nx,z:nz});moved=true;break;}}if(!moved)stack.pop();}}
 function distances(sx,sz){const dist=Array.from({length:SIZE},()=>Array(SIZE).fill(-1)),q=[{x:sx,z:sz}];dist[sx][sz]=0;for(let i=0;i<q.length;i++){const p=q[i];for(const d of [{x:1,z:0},{x:-1,z:0},{x:0,z:1},{x:0,z:-1}]){const x=p.x+d.x,z=p.z+d.z;if(x>0&&z>0&&x<SIZE-1&&z<SIZE-1&&maze[x][z]===0&&dist[x][z]<0){dist[x][z]=dist[p.x][p.z]+1;q.push({x,z});}}}return q.sort((a,b)=>dist[b.x][b.z]-dist[a.x][a.z]);}
 function buildWorld(){const group=new THREE.Group();scene.add(group);const wallGeo=new THREE.BoxGeometry(CELL,WALL_H,CELL),plane=new THREE.PlaneGeometry(CELL,CELL);for(let x=0;x<SIZE;x++)for(let z=0;z<SIZE;z++){const fx=x*CELL,fz=z*CELL;const f=new THREE.Mesh(plane,floorMat);f.rotation.x=-Math.PI/2;f.position.set(fx,0,fz);group.add(f);const c=new THREE.Mesh(plane,ceilMat);c.rotation.x=Math.PI/2;c.position.set(fx,WALL_H,fz);group.add(c);if(maze[x][z]){const w=new THREE.Mesh(wallGeo,wallMat);w.position.set(fx,WALL_H/2,fz);group.add(w);}}
 // Iluminação fluorescente em intervalos regulares
 for(let x=2;x<SIZE-1;x+=4)for(let z=2;z<SIZE-1;z+=4)if(maze[x][z]===0){const light=new THREE.PointLight(0xffe6ad,1.15,32);light.position.set(x*CELL,WALL_H-1,z*CELL);scene.add(light);const bulb=new THREE.Mesh(new THREE.BoxGeometry(2.8,.12,1.2),new THREE.MeshBasicMaterial({color:0xfff4cf}));bulb.position.copy(light.position);group.add(bulb);}}
 function createCar(){const g=new THREE.Group(),red=new THREE.MeshStandardMaterial({color:0x9f1010,metalness:.35,roughness:.35}),black=new THREE.MeshStandardMaterial({color:0x171717,roughness:.6});const body=new THREE.Mesh(new THREE.BoxGeometry(2.3,.8,4.4),red);body.position.y=.75;g.add(body);const cab=new THREE.Mesh(new THREE.BoxGeometry(1.8,.75,2.25),black);cab.position.set(0,1.45,-.15);g.add(cab);const wheelGeo=new THREE.CylinderGeometry(.42,.42,.28,16);for(const p of [{x:1.15,z:1.35},{x:-1.15,z:1.35},{x:1.15,z:-1.35},{x:-1.15,z:-1.35}]){const w=new THREE.Mesh(wheelGeo,black);w.rotation.z=Math.PI/2;w.position.set(p.x,.42,p.z);g.add(w);}const lampMat=new THREE.MeshBasicMaterial({color:0xfff1b0});for(const x of [-.72,.72]){const l=new THREE.SpotLight(0xffefc0,65,48,.48,.5,1);l.position.set(x,.85,-2);l.target.position.set(x,0,-12);g.add(l,l.target);const bulb=new THREE.Mesh(new THREE.SphereGeometry(.13,8,8),lampMat);bulb.position.set(x,.8,-2.2);g.add(bulb);}return g;}
 function createMonster(){const g=new THREE.Group(),black=new THREE.MeshBasicMaterial({color:0x030303}),white=new THREE.MeshBasicMaterial({color:0xffffff});const body=new THREE.Mesh(new THREE.CapsuleGeometry(.75,2.3,4,8),black);body.position.y=1.8;g.add(body);for(const x of [-.27,.27]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.11,8,8),white);eye.position.set(x,2.65,.58);g.add(eye);}return g;}
 function collision(pos,r){const gx=Math.round(pos.x/CELL),gz=Math.round(pos.z/CELL);for(let x=gx-1;x<=gx+1;x++)for(let z=gz-1;z<=gz+1;z++){if(x<0||z<0||x>=SIZE||z>=SIZE||maze[x][z]===1){const minX=x*CELL-CELL/2,maxX=x*CELL+CELL/2,minZ=z*CELL-CELL/2,maxZ=z*CELL+CELL/2;if(pos.x+r>minX&&pos.x-r<maxX&&pos.z+r>minZ&&pos.z-r<maxZ)return true;}}return false;}
 function setup(){scene=new THREE.Scene();scene.background=new THREE.Color(0x17130f);scene.fog=new THREE.FogExp2(0x17130f,.012);camera=new THREE.PerspectiveCamera(74,innerWidth/innerHeight,.1,700);renderer=new THREE.WebGLRenderer({canvas:el('game'),antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;scene.add(new THREE.HemisphereLight(0xffe7c2,0x34302a,.65));makeMaze();buildWorld();const start={x:1,z:1};camera.position.set(CELL,1.75,CELL);const reachable=distances(1,1);const carCell=reachable[Math.floor(reachable.length*.72)];const exitCell=reachable[reachable.length-1];car.mesh=createCar();car.mesh.position.set(carCell.x*CELL,0,carCell.z*CELL);car.mesh.rotation.y=Math.PI;car.pos.copy(car.mesh.position);scene.add(car.mesh);portal.pos.set(exitCell.x*CELL,3,exitCell.z*CELL);portal.mesh=new THREE.Mesh(new THREE.TorusGeometry(2.6,.35,12,64),new THREE.MeshBasicMaterial({color:0x00eaff}));portal.mesh.position.copy(portal.pos);scene.add(portal.mesh);const glow=new THREE.PointLight(0x00ddff,2,20);glow.position.copy(portal.pos);scene.add(glow);monster.mesh=createMonster();monster.mesh.visible=false;scene.add(monster.mesh);clock=new THREE.Clock();
 document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k in keys)keys[k]=true;if(k==='e')enterCar();});document.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k in keys)keys[k]=false;});
 setupTouch();window.addEventListener('resize',resize);el('btn-fullscreen').addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.();});
 el('error-screen').classList.add('ready');animate();}
 function setupTouch(){const zone=el('joystick-zone'),knob=el('joystick-knob');let joyId=null,joyX=0,joyY=0;zone.addEventListener('pointerdown',e=>{e.preventDefault();joyId=e.pointerId;zone.setPointerCapture(joyId);joyX=e.clientX;joyY=e.clientY;moveJoy(e);});zone.addEventListener('pointermove',e=>{if(e.pointerId===joyId)moveJoy(e);});function moveJoy(e){const dx=e.clientX-(zone.getBoundingClientRect().left+62),dy=e.clientY-(zone.getBoundingClientRect().top+62),len=Math.hypot(dx,dy),m=Math.min(43,len),a=Math.atan2(dy,dx);input.x=Math.cos(a)*m/43;input.y=Math.sin(a)*m/43;knob.style.transform=`translate(${Math.cos(a)*m}px,${Math.sin(a)*m}px)`;}function endJoy(e){if(e.pointerId===joyId){joyId=null;input.x=input.y=0;knob.style.transform='translate(0,0)';}}zone.addEventListener('pointerup',endJoy);zone.addEventListener('pointercancel',endJoy);
 // Arrastar o lado direito da tela controla a visão; no computador, arrastar com o mouse também funciona.
 let lookId=null,lastX=0,lastY=0;document.addEventListener('pointerdown',e=>{if(e.target.closest('.btn')||e.target.closest('#joystick-zone'))return;if(e.clientX>innerWidth*.38){lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;}});document.addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;yaw-=dx*.0045;pitch=Math.max(-1.15,Math.min(1.15,pitch-dy*.0035));});document.addEventListener('pointerup',e=>{if(e.pointerId===lookId)lookId=null;});
 function bind(id,key){const b=el(id);b.addEventListener('pointerdown',e=>{e.preventDefault();input[key]=true;b.setPointerCapture(e.pointerId);});const off=e=>{input[key]=false;};b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);}bind('btn-gas','gas');bind('btn-brake','brake');bind('btn-nitro','nitro');el('btn-enter').addEventListener('pointerdown',e=>{e.preventDefault();enterCar();});}
 function enterCar(){if(mode!=='FOOT'||camera.position.distanceTo(car.mesh.position)>10)return;mode='CAR';if(!audio){try{audio=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(audio?.state==='suspended')audio.resume();el('btn-enter').classList.add('hidden');el('btn-gas').classList.remove('hidden');el('btn-brake').classList.remove('hidden');el('btn-nitro').classList.remove('hidden');monster.active=true;monster.mesh.visible=true;monster.mesh.position.copy(car.mesh.position);monster.mesh.position.x+=12;}
 function playTone(freq,duration,type='sine'){if(!audio)return;try{const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.08,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration);}catch(e){}}
 function movePlayer(dt){let f=0,s=0;if(keys.w)f++;if(keys.s)f--;if(keys.a)s--;if(keys.d)s++;f+=-input.y;s+=input.x;const len=Math.hypot(f,s);if(len>1){f/=len;s/=len;}const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));const delta=forward.multiplyScalar(f*PLAYER_SPEED*dt).add(right.multiplyScalar(s*PLAYER_SPEED*dt));const next=camera.position.clone().add(delta);if(!collision(next,1))camera.position.copy(next);camera.rotation.order='YXZ';camera.rotation.set(pitch,yaw,0);}
 function moveCar(dt){let accel=0;if(keys.w||input.gas)accel=CAR_ACCEL;if(keys.s||input.brake)accel=-CAR_ACCEL;if(keys.shift||input.nitro)accel=CAR_ACCEL*1.8;car.speed+=accel*dt;car.speed*=Math.pow(.965,dt*60);car.speed=Math.max(-15,Math.min(62,car.speed));let steer=(keys.a?1:0)-(keys.d?1:0);if(input.x<-.2)steer=1;if(input.x>.2)steer=-1;if(Math.abs(car.speed)>.5)car.mesh.rotation.y+=steer*CAR_TURN*dt*(car.speed>=0?1:-1);const forward=new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0),car.mesh.rotation.y),next=car.mesh.position.clone().addScaledVector(forward,car.speed*dt);if(!collision(next,2.2))car.mesh.position.copy(next);else car.speed*=-.22;car.pos.copy(car.mesh.position);const offset=new THREE.Vector3(0,3.2,7).applyAxisAngle(new THREE.Vector3(0,1,0),car.mesh.rotation.y);const target=car.mesh.position.clone().add(offset);camera.position.lerp(target,Math.min(1,dt*5));camera.lookAt(car.mesh.position.clone().add(new THREE.Vector3(0,1,-4).applyAxisAngle(new THREE.Vector3(0,1,0),car.mesh.rotation.y)));}
 function updateGPS(target,label){const dir=new THREE.Vector3().subVectors(target,camera.position),angle=Math.atan2(dir.x,dir.z),diff=angle-yaw;el('gps-arrow').style.transform=`rotate(${diff}rad)`;el('gps-dist').textContent=label+': '+Math.round(camera.position.distanceTo(target))+' m';}
 function finish(win){if(ended)return;ended=true;el('game-over').style.display='flex';el('end-title').textContent=win?'SIGNAL RESTORED':'SIGNAL LOST';el('end-title').style.color=win?'#0f0':'#f44';el('end-reason').textContent=win?'Você escapou do Level 0.':'A entidade te encontrou.';playTone(win?660:90,1,win?'sine':'sawtooth');}
 let noiseTimer=0;function animate(){if(ended)return;requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(mode==='FOOT'){movePlayer(dt);const d=camera.position.distanceTo(car.mesh.position);if(d<10){el('btn-enter').classList.remove('hidden');}else el('btn-enter').classList.add('hidden');updateGPS(car.mesh.position,'CARRO');}else{moveCar(dt);const dir=new THREE.Vector3().subVectors(camera.position,monster.mesh.position),d=dir.length();if(d>0){dir.normalize();monster.mesh.position.addScaledVector(dir,MONSTER_SPEED*dt);monster.mesh.lookAt(camera.position);}el('vhs-overlay').style.opacity=d<18?String(.55+Math.random()*.45):'1';updateGPS(portal.pos,'SAÍDA');if(d<2.5)finish(false);if(car.mesh.position.distanceTo(portal.pos)<5)finish(true);}portal.mesh.rotation.z+=dt*.8;renderer.render(scene,camera);}
 function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}
 try{setup();}catch(e){showLoadError(e.stack||e.message||String(e));}
}
</script>
</body></html>
